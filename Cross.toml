    libcairo-dev:$CROSS_DEB_ARCH \
    libzvbi-dev:$CROSS_DEB_ARCH \
    libsnappy-dev:$CROSS_DEB_ARCH \
    libaom-dev:$CROSS_DEB_ARCH \
    libcodec2-dev:$CROSS_DEB_ARCH \
    libgsm1-dev:$CROSS_DEB_ARCH \
    libopenjp2-7-dev:$CROSS_DEB_ARCH \
