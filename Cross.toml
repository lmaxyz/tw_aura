    libmp3lame-dev:$CROSS_DEB_ARCH \
    libsdl2-dev:$CROSS_DEB_ARCH \
    libva-dev:$CROSS_DEB_ARCH \
    libvdpau-dev:$CROSS_DEB_ARCH \
    libvorbis-dev:$CROSS_DEB_ARCH \
    libxcb1-dev:$CROSS_DEB_ARCH \
    libxcb-shm0-dev:$CROSS_DEB_ARCH \
    libxcb-xfixes0-dev:$CROSS_DEB_ARCH \
    libxml2-dev:$CROSS_DEB_ARCH \
